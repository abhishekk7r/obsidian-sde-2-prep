<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="30" width="280" height="120" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="54" font-size="14" font-weight="500" fill="#26215C">Task arrives, no idle thread</text>

<rect x="70" y="80" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="180" y="98" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">New thread created</text>
<text x="180" y="116" font-size="12" text-anchor="middle" fill="#185FA5">runs the task immediately</text>

<rect x="360" y="30" width="280" height="120" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="380" y="54" font-size="14" font-weight="500" fill="#085041">Task arrives, idle thread exists</text>

<rect x="390" y="80" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="500" y="98" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Idle thread reused</text>
<text x="500" y="116" font-size="12" text-anchor="middle" fill="#185FA5">no new thread needed</text>

<rect x="200" y="190" width="280" height="90" rx="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="220" y="214" font-size="14" font-weight="500" fill="#633806">Thread idle 60s+</text>
<text x="220" y="234" font-size="12" fill="#854F0B">terminated and removed from pool</text>

<path d="M180,124 C180,160 280,175 340,220" fill="none" stroke="#444441" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="200" y="170" font-size="12" text-anchor="middle" fill="#444441">if it goes idle</text>
</svg>
