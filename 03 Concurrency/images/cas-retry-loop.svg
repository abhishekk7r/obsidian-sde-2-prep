<text x="280" y="145" font-size="12" fill="#444441">no — retry from read</text>
<rect x="40" y="200" width="600" height="45" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="222" font-size="12" fill="#633806">Extreme contention: repeated failures → wasted CPU + cache-line bouncing across cores</text>
