<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="30" y="30" width="150" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="105" y="54" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">Read current value</text>
<rect x="230" y="30" width="150" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="305" y="54" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">Compute new value</text>
<rect x="430" y="20" width="200" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="530" y="44" font-size="13" font-weight="500" text-anchor="middle" fill="#26215C">CAS: still matches</text>
<text x="530" y="62" font-size="13" font-weight="500" text-anchor="middle" fill="#26215C">expected value?</text>
<line x1="180" y1="54" x2="230" y2="54" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="54" x2="430" y2="54" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460" y="130" width="150" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="154" font-size="13" font-weight="500" text-anchor="middle" fill="#085041">Swap succeeds</text>
<line x1="530" y1="88" x2="535" y2="130" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="110" font-size="12" fill="#444441">yes</text>
