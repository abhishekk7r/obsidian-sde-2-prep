<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
<rect x="30" y="20" width="300" height="220" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="50" y="44" font-size="14" font-weight="500" fill="#085041">ConcurrentHashMap</text>
<rect x="55" y="70" width="60" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="85" y="90" font-size="12" text-anchor="middle" fill="#0C447C">Bin 1</text>
<rect x="130" y="70" width="60" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="160" y="90" font-size="12" text-anchor="middle" fill="#791F1F">Bin 2</text>
<rect x="205" y="70" width="60" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="235" y="90" font-size="12" text-anchor="middle" fill="#0C447C">Bin 3</text>
<rect x="55" y="130" width="60" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="85" y="150" font-size="12" text-anchor="middle" fill="#0C447C">Bin 4</text>
<rect x="130" y="130" width="60" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="160" y="150" font-size="12" text-anchor="middle" fill="#0C447C">Bin 5</text>
<rect x="205" y="130" width="60" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="235" y="150" font-size="12" text-anchor="middle" fill="#0C447C">Bin 6</text>
<text x="50" y="205" font-size="12" fill="#444441">Only Bin 2 is locked —</text>
<text x="50" y="222" font-size="12" fill="#444441">others stay writable</text>

<rect x="380" y="20" width="270" height="220" rx="16" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="400" y="44" font-size="14" font-weight="500" fill="#791F1F">synchronizedMap</text>
<rect x="410" y="80" width="220" height="110" rx="10" fill="#F6D5D5" stroke="#A32D2D" stroke-width="0.5"/>
<text x="520" y="135" font-size="13" font-weight="500" text-anchor="middle" fill="#791F1F">entire map locked</text>
<text x="400" y="210" font-size="12" fill="#444441">Every read and write waits</text>
<text x="400" y="227" font-size="12" fill="#444441">on the same single lock</text>
</svg>
