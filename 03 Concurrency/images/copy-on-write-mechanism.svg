<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="40" y="40" width="220" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="150" y="58" font-size="13" font-weight="500" text-anchor="middle" fill="#2C2C2A">Old array [A, B, C]</text>
<text x="150" y="76" font-size="11" text-anchor="middle" fill="#5F5E5A">iterator still walking this</text>

<rect x="420" y="40" width="220" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="58" font-size="13" font-weight="500" text-anchor="middle" fill="#085041">New array [A, B, C, D]</text>
<text x="530" y="76" font-size="11" text-anchor="middle" fill="#0F6E56">created on write</text>

<path d="M260,65 C320,65 360,65 420,65" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="50" font-size="11" text-anchor="middle" fill="#444441">copy + append D</text>

<rect x="230" y="150" width="220" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="168" font-size="13" font-weight="500" text-anchor="middle" fill="#26215C">List's internal reference</text>
<text x="340" y="186" font-size="11" text-anchor="middle" fill="#534AB7">atomically swapped to new array</text>
<line x1="530" y1="90" x2="400" y2="150" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="150" y1="90" x2="150" y2="150" stroke="#444441" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="60" y="130" font-size="11" fill="#444441">existing iterator</text>
<text x="60" y="215" font-size="11" fill="#444441">never redirected —</text>
<text x="60" y="232" font-size="11" fill="#444441">keeps reading [A, B, C]</text>
</svg>
