<svg width="680" height="670" viewBox="0 0 680 670" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="40" width="600" height="210" rx="16" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="60" y="64" font-size="14" font-weight="500" fill="#791F1F">Deadlock — blocked, circular wait</text>

<rect x="80" y="130" width="170" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="165" y="148" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Thread A</text>
<text x="165" y="166" font-size="12" text-anchor="middle" fill="#185FA5">holds Lock 1</text>

<rect x="430" y="130" width="170" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="515" y="148" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Thread B</text>
<text x="515" y="166" font-size="12" text-anchor="middle" fill="#185FA5">holds Lock 2</text>

<path d="M258,140 C320,95 350,95 430,140" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M430,178 C350,225 320,225 258,178" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="118" font-size="12" text-anchor="middle" fill="#791F1F">wants Lock 2</text>
<text x="340" y="200" font-size="12" text-anchor="middle" fill="#791F1F">wants Lock 1</text>

<rect x="40" y="270" width="600" height="170" rx="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="294" font-size="14" font-weight="500" fill="#633806">Livelock — active, but no progress</text>

<rect x="80" y="340" width="170" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="165" y="358" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Thread A</text>
<text x="165" y="376" font-size="12" text-anchor="middle" fill="#185FA5">keeps yielding to B</text>

<rect x="430" y="340" width="170" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="515" y="358" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Thread B</text>
<text x="515" y="376" font-size="12" text-anchor="middle" fill="#185FA5">keeps yielding to A</text>

<path d="M258,344 C320,318 350,318 430,344" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M430,374 C350,400 320,400 258,374" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<rect x="40" y="460" width="600" height="170" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="484" font-size="14" font-weight="500" fill="#2C2C2A">Starvation — one thread never gets a turn</text>

<rect x="60" y="540" width="130" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="558" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">Thread 1</text>
<text x="125" y="576" font-size="12" text-anchor="middle" fill="#0F6E56">runs often</text>

<rect x="210" y="540" width="130" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="275" y="558" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">Thread 2</text>
<text x="275" y="576" font-size="12" text-anchor="middle" fill="#0F6E56">runs often</text>

<rect x="360" y="540" width="130" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="425" y="558" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">Thread 3</text>
<text x="425" y="576" font-size="12" text-anchor="middle" fill="#0F6E56">runs often</text>

<rect x="510" y="540" width="130" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="575" y="558" font-size="14" font-weight="500" text-anchor="middle" fill="#2C2C2A">Thread 4</text>
<text x="575" y="576" font-size="12" text-anchor="middle" fill="#5F5E5A">always skipped</text>
</svg>
