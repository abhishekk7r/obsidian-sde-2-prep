<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="20" width="600" height="280" rx="16" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="44" font-size="14" font-weight="500" fill="#173404">Fixed lock order — no circular wait possible</text>

<rect x="70" y="80" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="180" y="100" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Thread 1: transfer(A → B)</text>
<text x="180" y="118" font-size="12" text-anchor="middle" fill="#185FA5">locks Account 1, then Account 2</text>

<rect x="390" y="80" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="500" y="100" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Thread 2: transfer(B → A)</text>
<text x="500" y="118" font-size="12" text-anchor="middle" fill="#185FA5">locks Account 1, then Account 2</text>

<rect x="150" y="200" width="140" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="218" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">Account 1</text>
<text x="220" y="236" font-size="12" text-anchor="middle" fill="#0F6E56">lower ID, locked first</text>

<rect x="390" y="200" width="140" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="460" y="218" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">Account 2</text>
<text x="460" y="236" font-size="12" text-anchor="middle" fill="#0F6E56">higher ID, locked second</text>

<path d="M180,136 L220,198" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500,136 L230,198" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M220,248 L280,248 L460,200" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M460,248 L500,248 L520,200" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="280" font-size="12" text-anchor="middle" fill="#444441">Both threads queue for Account 1 first — no thread ever holds one lock while blocked on the other's held lock</text>
</svg>
