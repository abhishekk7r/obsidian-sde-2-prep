<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
<rect x="40" y="30" width="600" height="120" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="54" font-size="14" font-weight="500" fill="#26215C">Semaphore — N permits, many holders</text>
<rect x="70" y="90" width="90" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="110" font-size="12" text-anchor="middle" fill="#0C447C">Thread A</text>
<rect x="180" y="90" width="90" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="225" y="110" font-size="12" text-anchor="middle" fill="#0C447C">Thread B</text>
<rect x="290" y="90" width="90" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="335" y="110" font-size="12" text-anchor="middle" fill="#2C2C2A">Thread C waits</text>
<text x="470" y="110" font-size="12" fill="#444441">2 permits held, 1 waiting</text>

<rect x="40" y="170" width="600" height="130" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="194" font-size="14" font-weight="500" fill="#085041">CountDownLatch — one-time gate</text>
<rect x="70" y="230" width="90" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="250" font-size="12" text-anchor="middle" fill="#0C447C">Worker 1</text>
<rect x="180" y="230" width="90" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="225" y="250" font-size="12" text-anchor="middle" fill="#0C447C">Worker 2</text>
<rect x="330" y="230" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="390" y="250" font-size="12" text-anchor="middle" fill="#2C2C2A">Main thread waits</text>
<text x="470" y="250" font-size="12" fill="#444441">count → 0, opens once, never resets</text>

<rect x="40" y="330" width="600" height="130" rx="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="354" font-size="14" font-weight="500" fill="#633806">CyclicBarrier — all wait for each other, resets</text>
<rect x="70" y="390" width="90" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="410" font-size="12" text-anchor="middle" fill="#0C447C">Thread 1</text>
<rect x="180" y="390" width="90" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="225" y="410" font-size="12" text-anchor="middle" fill="#0C447C">Thread 2</text>
<rect x="290" y="390" width="90" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="335" y="410" font-size="12" text-anchor="middle" fill="#0C447C">Thread 3</text>
<text x="470" y="410" font-size="12" fill="#444441">all trip barrier together, then reused</text>
</svg>
