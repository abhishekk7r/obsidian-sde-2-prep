<text x="60" y="54" font-size="14" font-weight="500" fill="#26215C">Thousands of virtual threads (JVM-managed, cheap)</text>

<rect x="65" y="80" width="90" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="110" y="98" font-size="12" text-anchor="middle" fill="#0C447C">VT 1</text>
