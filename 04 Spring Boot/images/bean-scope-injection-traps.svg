<svg width="700" height="480" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="20" y="20" width="660" height="170" rx="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="40" y="44" font-size="13" font-weight="500" fill="#633806">Q5 — prototype bean, field injection, into a singleton</text>

<rect x="60" y="70" width="220" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="170" y="98" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">Singleton bean</text>
<text x="170" y="117" font-size="11" text-anchor="middle" fill="#185FA5">field-injected once</text>

<rect x="420" y="70" width="220" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="530" y="98" font-size="13" font-weight="500" text-anchor="middle" fill="#633806">Prototype instance</text>
<text x="530" y="117" font-size="11" text-anchor="middle" fill="#854F0B">same instance forever</text>

<text x="350" y="98" font-size="11" text-anchor="middle" fill="#633806">wired once</text>
<text x="350" y="112" font-size="11" text-anchor="middle" fill="#633806">at construction</text>
<line x1="280" y1="105" x2="418" y2="105" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="20" y="220" width="660" height="240" rx="16" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="40" y="244" font-size="13" font-weight="500" fill="#791F1F">Q1 — request-scoped bean, constructor injection, no scoped proxy</text>

<rect x="60" y="270" width="220" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="170" y="298" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">Singleton controller</text>
<text x="170" y="317" font-size="11" text-anchor="middle" fill="#185FA5">constructor injection</text>

<rect x="420" y="270" width="220" height="70" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="530" y="298" font-size="13" font-weight="500" text-anchor="middle" fill="#791F1F">Request scope</text>
<text x="530" y="317" font-size="11" text-anchor="middle" fill="#A32D2D">not active — no request yet</text>

<text x="350" y="298" font-size="11" text-anchor="middle" fill="#791F1F">tries to resolve</text>
<text x="350" y="312" font-size="11" text-anchor="middle" fill="#791F1F">at startup</text>
<line x1="280" y1="305" x2="418" y2="305" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<line x1="350" y1="340" x2="350" y2="378" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="380" width="300" height="60" rx="8" fill="#791F1F" stroke="#791F1F" stroke-width="0.5"/>
<text x="350" y="404" font-size="12" font-weight="500" text-anchor="middle" fill="#FCEBEB">Startup failure</text>
<text x="350" y="422" font-size="11" text-anchor="middle" fill="#F7C1C1">Scope 'request' is not active for the current thread</text>
</svg>
