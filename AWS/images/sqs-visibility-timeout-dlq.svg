<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="20" y="20" width="200" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="120" y="43" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">Main queue</text>
<text x="120" y="62" font-size="11" text-anchor="middle" fill="#185FA5">message received</text>

<line x1="220" y1="50" x2="258" y2="50" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="20" width="220" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="370" y="43" font-size="13" font-weight="500" text-anchor="middle" fill="#633806">Invisible (leased)</text>
<text x="370" y="62" font-size="11" text-anchor="middle" fill="#854F0B">visibilityTimeout window</text>

<line x1="370" y1="80" x2="370" y2="118" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470" y="105" font-size="11" fill="#854F0B">consumer deletes → done</text>
<line x1="480" y1="50" x2="640" y2="50" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="120" width="220" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="370" y="143" font-size="13" font-weight="500" text-anchor="middle" fill="#791F1F">Timeout expires</text>
<text x="370" y="162" font-size="11" text-anchor="middle" fill="#A32D2D">consumer crashed / no delete</text>

<line x1="260" y1="150" x2="222" y2="150" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="120" y="140" font-size="11" text-anchor="middle" fill="#A32D2D">visible again</text>
<line x1="120" y1="150" x2="120" y2="82" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="120" y="200" font-size="11" text-anchor="middle" fill="#5F5E5A">receive count += 1</text>

<line x1="370" y1="180" x2="370" y2="218" stroke="#791F1F" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="205" font-size="11" fill="#791F1F">receiveCount ≥ maxReceiveCount</text>

<rect x="260" y="220" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="370" y="243" font-size="13" font-weight="500" text-anchor="middle" fill="#2C2C2A">DLQ</text>
<text x="370" y="262" font-size="11" text-anchor="middle" fill="#5F5E5A">quarantine — not a retry queue</text>
</svg>
