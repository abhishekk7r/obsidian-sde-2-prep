<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="250" y="20" width="200" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="43" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">@ConditionalOnClass</text>
<text x="350" y="62" font-size="11" text-anchor="middle" fill="#185FA5">required class on classpath?</text>

<line x1="350" y1="80" x2="350" y2="118" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="120" width="200" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="143" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">@ConditionalOnMissingBean</text>
<text x="350" y="162" font-size="11" text-anchor="middle" fill="#185FA5">has the user already defined this bean?</text>

<path d="M350,180 L350,200 L190,200 L190,218" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M350,180 L350,200 L510,200 L510,218" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="220" width="260" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="243" font-size="13" font-weight="500" text-anchor="middle" fill="#085041">No existing bean</text>
<text x="190" y="262" font-size="11" text-anchor="middle" fill="#0F6E56">auto-config creates the bean</text>

<rect x="380" y="220" width="260" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="510" y="243" font-size="13" font-weight="500" text-anchor="middle" fill="#633806">Bean already defined</text>
<text x="510" y="262" font-size="11" text-anchor="middle" fill="#854F0B">auto-config backs off, yours wins</text>
</svg>
