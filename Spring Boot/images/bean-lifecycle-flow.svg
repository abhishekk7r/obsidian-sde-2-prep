<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="20" y="20" font-size="12" fill="#5F5E5A">Startup / wiring — happens once for a singleton</text>

<rect x="20" y="40" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="95" y="63" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">1. Instantiate</text>
<text x="95" y="82" font-size="11" text-anchor="middle" fill="#185FA5">Constructor called</text>

<rect x="190" y="40" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="265" y="63" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">2. Populate</text>
<text x="265" y="82" font-size="11" text-anchor="middle" fill="#185FA5">Dependencies injected</text>

<rect x="360" y="40" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="435" y="63" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">3. Aware callbacks</text>
<text x="435" y="82" font-size="11" text-anchor="middle" fill="#185FA5">BeanNameAware etc.</text>

<rect x="530" y="40" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="605" y="63" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">4. PostProcess before</text>
<text x="605" y="82" font-size="11" text-anchor="middle" fill="#185FA5">BeanPostProcessor</text>

<line x1="170" y1="75" x2="188" y2="75" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="75" x2="358" y2="75" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="75" x2="528" y2="75" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="605" y1="110" x2="605" y2="188" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="530" y="190" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="605" y="213" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">5. Init callbacks</text>
<text x="605" y="232" font-size="11" text-anchor="middle" fill="#185FA5">@PostConstruct etc.</text>

<rect x="360" y="190" width="150" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="435" y="213" font-size="13" font-weight="500" text-anchor="middle" fill="#633806">6. PostProcess after</text>
<text x="435" y="232" font-size="11" text-anchor="middle" fill="#854F0B">AOP proxy created here</text>

<rect x="190" y="190" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="265" y="213" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">7. Ready</text>
<text x="265" y="232" font-size="11" text-anchor="middle" fill="#185FA5">Available in container</text>

<rect x="20" y="190" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="95" y="213" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">8. Singleton lives on</text>
<text x="95" y="232" font-size="11" text-anchor="middle" fill="#185FA5">One instance, whole life</text>

<line x1="528" y1="225" x2="512" y2="225" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="358" y1="225" x2="342" y2="225" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="188" y1="225" x2="172" y2="225" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="95" y1="260" x2="95" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="20" y="320" width="300" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="170" y="348" font-size="13" font-weight="500" text-anchor="middle" fill="#2C2C2A">Destroy — shutdown only</text>
<text x="170" y="367" font-size="11" text-anchor="middle" fill="#5F5E5A">@PreDestroy — prototype beans never get this</text>
</svg>
