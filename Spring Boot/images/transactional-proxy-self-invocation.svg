<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="20" y="40" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="105" y="63" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">Caller</text>
<text x="105" y="82" font-size="11" text-anchor="middle" fill="#185FA5">another bean</text>

<rect x="260" y="40" width="170" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="345" y="63" font-size="13" font-weight="500" text-anchor="middle" fill="#633806">Proxy (AOP)</text>
<text x="345" y="82" font-size="11" text-anchor="middle" fill="#854F0B">begin / commit / rollback</text>

<rect x="500" y="40" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="585" y="63" font-size="13" font-weight="500" text-anchor="middle" fill="#0C447C">Target bean</text>
<text x="585" y="82" font-size="11" text-anchor="middle" fill="#185FA5">method body runs here</text>

<line x1="190" y1="70" x2="258" y2="70" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430" y1="70" x2="498" y2="70" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M520,100 C520,150 650,150 650,100" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="585" y1="150" x2="585" y2="183" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>

<rect x="60" y="185" width="580" height="55" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="350" y="207" font-size="12" text-anchor="middle" fill="#791F1F">Self-invocation: this.foo() from within the same bean</text>
<text x="350" y="225" font-size="12" text-anchor="middle" fill="#791F1F">bypasses the proxy — no transaction</text>
</svg>
